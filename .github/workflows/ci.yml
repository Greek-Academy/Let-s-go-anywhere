name: CI

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-pilot:
    name: Firebase emulator and permission tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Java for the local Firestore emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:firebase:rules
      - run: npx playwright install --with-deps chromium webkit
      - name: Install Japanese fonts
        run: sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - run: npm run test:firebase:ui
      - run: npm run test:dogfood
      - name: Upload public test browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-report
          path: dogfood-playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Firebase pilot browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-pilot-report
          path: |
            firebase-playwright-report/
            firebase-test-results/
          if-no-files-found: ignore
          retention-days: 14
  verify:
    name: Build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check and build
        run: npm run build

      - name: Build local content review tool
        run: npm run build:review

      - name: Verify static preview artifact
        run: npm run verify:preview -- --for-upload

      - name: Test release backup and restore guards
        run: npm run test:release-backup

      - name: Validate national station import guards (offline)
        run: node --test scripts/import-stations.test.mjs

      - name: Test public search limits with local D1 and fake providers
        run: npm run test:public-search

      - name: Test search pilot with fake provider only
        run: npm run test:research

      - name: Install Chromium, WebKit and browser dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Install Japanese fonts for screenshots
        run: sudo apt-get install --no-install-recommends -y fonts-noto-cjk

      - name: Run Chromium and WebKit flows on the built preview
        run: npm run test:preview

      - name: Test local content review tool
        run: npm run test:review

      - name: Test search pilot browser flows without external API calls
        run: npm run test:research:ui

      - name: Test discovery integration with a separate sample-only backend
        run: npm run test:discovery-search

      - name: Upload discovery search report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discovery-search-report
          path: discovery-search-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload content review report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-review-report
          path: review-playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload offline search pilot report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-pilot-report
          path: research-playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save tested static preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-details
          path: |
            test-results/
            review-test-results/
          if-no-files-found: ignore
          retention-days: 14
